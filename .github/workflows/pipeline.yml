name: CD - IHSG Ingestion

on:
  schedule:
    # Setiap 6 jam (00, 06, 12, 18 UTC = 07, 13, 19, 01 WIB)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ihsg-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest 8 instrumen ke Azure Blob
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login ke Azure (OIDC, tanpa client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Jalankan pipeline ingestion
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: python -m src.main

      - name: Verifikasi blob hari ini
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: python -m src.verify

      - name: Simpan manifest sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.run_id }}
          path: data/**/_manifest/*.json
          if-no-files-found: ignore
