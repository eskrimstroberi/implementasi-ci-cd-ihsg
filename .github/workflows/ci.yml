name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint dengan Ruff
        run: ruff check src tests

      - name: Unit test dengan Pytest
        run: pytest -q

      - name: Smoke test pipeline (lokal, tanpa Azure)
        run: python -m src.main --local --start 2025-06-01 --tickers "^JKSE"

      - name: Tampilkan manifest hasil smoke test
        run: find data -name "manifest.json" -print -exec cat {} \;
